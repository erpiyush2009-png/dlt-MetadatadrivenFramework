resources:
  pipelines:
    dlt_meta_silver:
      name: dlt_meta_silver
      ## If NOT using SERVERLESS, uncomment the following lines
      # clusters:
      #   - label: default
      #     num_workers: 1
      #     node_type_id: Standard_D4s_v5
      configuration:
        "silver.dataflowspecTable": "${var.Metadata_Catalog}.${var.Metadata_Schema}.silver_dataflowspec_table"
        "layer": "silver"
        "silver.group": ${var.Silver_Dataflow_Group}
        "spark.databricks.acl.needAdminPermissionToViewLogs": "false"
      libraries:
        - notebook:
            path: ../src/init_dlt_meta_pipeline.py
      channel: CURRENT

      catalog: ${var.Data_Catalog}
      schema: ${var.Silver_Schema}
      serverless: false

      event_log:
        name: dlt_meta_silver_event_log
        catalog: ${var.event_log_catalog}
        schema: ${var.event_log_schema}     

      clusters:
        - label: default
          # The default cluster configuration for this pipeline
          node_type_id: Standard_D8ads_v5   
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            # The default tags to be applied to all clusters in this pipeline
            cluster_usage: factory migration team DLT
        - label: maintenance
          # The maintenance cluster configuration for this pipeline
          node_type_id: Standard_D8ads_v5
          autoscale:
            min_workers: 1
            max_workers: 1
            mode: LEGACY      